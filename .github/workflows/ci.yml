name: CI

on:
  push:
    branches: [main]
  pull_request:

# The gate is deliberately the same set of commands a developer runs locally,
# in the same order, so a green CI run means what it appears to mean.
jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the reason this matrix exists: development happens on macOS,
        # and a path or shell assumption that only holds there would otherwise
        # ship unnoticed.
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]

    steps:
      # Full history: the transcript names the commit it was generated at, and
      # the provenance step below has to resolve that commit. The default
      # checkout fetches only the triggering one, so the step would fail on
      # every hosted job while passing locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No version input: pnpm/action-setup errors when its input disagrees with
      # the packageManager field, and package.json already pins the version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck source and tests
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Source constraints
        run: node scripts/check-forbidden-terms.mjs

      # The index is a tracked artefact, so its schema, its agreement with
      # repos.json and its invariants can all be checked without a scan.
      - name: Index schema and invariants
        run: node scripts/report-index.mjs

      # The transcript names the commit it was generated at. This fails when
      # code has moved since, which is the only thing that makes it stale.
      - name: Verification transcript still describes this code
        run: node scripts/check-transcript-provenance.mjs

      # Every step above reports that a check passed. This one reports that the
      # checks can fail: twelve deliberate breakages of a copied index, source
      # tree or hook configuration, each of which must be noticed — and each
      # required to pass on the unbroken input first, so a checker that was
      # already failing cannot masquerade as a detection.
      - name: The gates can fail
        run: node scripts/check-negative-controls.mjs

      # No credential is present here, so enrichment and the gate cannot run.
      # Every test injects its model client, so the suite is unaffected — and
      # that is worth asserting rather than assuming.
      - name: Tests and coverage
        run: pnpm test
        env:
          ANTHROPIC_API_KEY: ""

      # The suite passed over a real bypass once — a plan carrying a valid gate
      # record was blocked and 391 unit tests were green — so the matrix runs
      # here too. It supplies its own configuration and aborts if an ungated
      # plan is not blocked, so it cannot report a pass it has not earned.
      - name: Hook enforcement matrix
        run: node scripts/hook-matrix.mjs

      # Not inside vitest: the runner's own parallelism dominated the
      # measurement there, which made the number about the runner and not about
      # the hook. As its own step nothing else is competing for the CPU.
      - name: Hook latency budget
        run: node scripts/hook-latency.mjs

      # Asserts the documented fail-open: unconfigured, the hook must allow
      # rather than start refusing writes on the strength of a default. The
      # step fails if node exits non-zero.
      - name: Hook allows when it has no configuration directory
        run: |
          echo '{"tool_name":"Write","tool_input":{"file_path":"/tmp/x.md"}}' \
            | node hooks/dist/gate-hook.js
